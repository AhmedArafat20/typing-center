<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الموقع متوقف مؤقتاً</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Tahoma', 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#1a1a2e 0%,#2d2d5e 100%);
    min-height: 100vh;
    display:flex; align-items:center; justify-content:center;
    padding: 20px;
  }
  .box {
    background:#fff; border-radius:20px; padding:48px 36px;
    max-width:440px; width:100%; text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.25);
  }
  .icon { font-size:3rem; margin-bottom:18px; }
  h1 { font-size:1.4rem; color:#1a1a2e; margin-bottom:14px; }
  p { font-size:0.95rem; color:#5a6279; line-height:1.7; margin-bottom:10px; }
  .small { font-size:0.8rem; color:#8a91a8; margin-top:20px; }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">🛠️</div>
    <h1>هذا الموقع متوقف مؤقتاً</h1>
    <p>نقوم حالياً بإجراء بعض التحديثات على الموقع.</p>
    <p>سيتم تشغيل الموقع مرة أخرى قريباً.</p>
    <p class="small">للاستعلام يرجى التواصل مع الجهة المسؤولة عن الموقع.</p>
  </div>
</body>
</html>
